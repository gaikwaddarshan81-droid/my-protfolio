<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title description">
  <title id="title">Profile photo placeholder</title>
  <desc id="description">A simple illustrated avatar placeholder. Replace this image with a profile photo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#dce6ff"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#496bd0"/>
      <stop offset="1" stop-color="#294aa9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#background)"/>
  <circle cx="200" cy="200" r="150" fill="#ffffff" opacity=".34"/>
  <circle cx="200" cy="152" r="65" fill="#d7a985"/>
  <path d="M137 151c-2-53 24-83 65-83 42 0 68 32 63 84-17-10-28-25-33-40-18 25-51 39-95 39Z" fill="#26314c"/>
  <path d="M99 369c7-85 45-129 101-129s94 44 101 129" fill="url(#shirt)"/>
